const svg=document.getElementById('canvas'),world=document.getElementById('world'),edges=document.getElementById('edges'),nodes=document.getElementById('nodes'),menu=document.getElementById('menu');const NS='http://www.w3.org/2000/svg';let view={x:innerWidth/2,y:innerHeight/2,k:.85},positions=new Map(),selected=null,multi=new Set(),drag=null,editNode=null,lastNodeClick=null;const overlay=document.getElementById('overlay');const colors=['#A5C5EB','#B4DCC7','#E6C28F','#C6B8ED','#EDB5BC','#B6C9CF'];

  for(const t of group.querySelectorAll('text'))t.style.visibility='hidden';

  editor.setAttribute('role','textbox');

  foreign.appendChild(editor);

  editNode=null;render();

svg.addEventListener('pointerdown',e=>{if(editNode&&e.target.closest('.node.editing'))return;if(editNode)finishEdit();if(e.button!==0)return;menu.classList.remove('visible');let g=e.target.closest('.node');let n=g?find(g.dataset.id):null;let mode=!n?'box':(e.shiftKey?'toggle':'nodes');if(n){if(e.shiftKey){if(multi.has(n.id))multi.delete(n.id);else multi.add(n.id);selected=null;render();mode='toggle'}else if(!multi.has(n.id)){multi.clear();multi.add(n.id);selected=n;render()}}else {if(!e.shiftKey)multi.clear();selected=null;render()}drag={n,mode,clientX:e.clientX,clientY:e.clientY,oldX:e.clientX,oldY:e.clientY,moved:false,base:new Set(multi)};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});
